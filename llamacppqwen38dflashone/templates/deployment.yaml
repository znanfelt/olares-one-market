apiVersion: v1
kind: ConfigMap
metadata:
  name: llamacpp-qwen38-dflash-env
  namespace: "{{ .Release.Namespace }}"
data:
  TARGET_MODEL: "unsloth/Qwen3.8-27B-GGUF"
  TARGET_FILE: "Qwen3.8-27B-UD-Q4_K_XL.gguf"
  DRAFT_MODEL: "incoai/Qwen3.8-27B-DFlash2-GGUF"
  DRAFT_FILE: "Qwen3.8-27B-DFlash2-Q4_K_M.gguf"
  MODEL_ALIAS: "qwen3.8-27b-dflash2"
  CTX_SIZE: "98304"
  THREADS: "16"
  SPEC_DRAFT_N_MAX: "7"
  CHAT_TEMPLATE_URL: "https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates/resolve/855bffc49448e299789730ff92c9b8d834d6cc14/chat_template.jinja"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: llamacppqwen38dflashone
  name: llamacppqwen38dflashone
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: llamacppqwen38dflashone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacppqwen38dflashone
    spec:
      initContainers:
        - name: fix-shared-perms
          image: "docker.io/alpine:3.20"
          command: ["sh", "-c", "mkdir -p /shared-models/llms && chmod -R 777 /shared-models && echo perms-fixed"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: "/shared-models"
              name: shared-models
      containers:
        - name: llamacpp-qwen38-dflash-server
          image: "docker.io/aamsellem/buun-llama-cpp-dflash:0.2.0"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              MODELS_DIR=${MODELS_DIR:-/models}
              SHARED_DIR=${SHARED_DIR:-/shared-models/llms}
              mkdir -p "$MODELS_DIR" "$SHARED_DIR" /config
              HF_AUTH=""
              if [ -n "$HF_TOKEN" ]; then HF_AUTH="-H \"Authorization: Bearer $HF_TOKEN\""; fi
              if [ -f "$MODELS_DIR/$TARGET_FILE" ] && [ ! -f "$SHARED_DIR/$TARGET_FILE.ok" ]; then
                echo "==> Migrating $TARGET_FILE from per-app to shared"
                mv "$MODELS_DIR/$TARGET_FILE" "$SHARED_DIR/$TARGET_FILE"
                touch "$SHARED_DIR/$TARGET_FILE.ok"
              fi
              if [ ! -f "$SHARED_DIR/$TARGET_FILE.ok" ]; then
                echo "==> Downloading shared target $TARGET_FILE"
                eval curl -fL -C - --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30 $HF_AUTH \
                  "https://huggingface.co/${TARGET_MODEL}/resolve/main/${TARGET_FILE}" \
                  -o "$SHARED_DIR/$TARGET_FILE"
                touch "$SHARED_DIR/$TARGET_FILE.ok"
              fi
              if [ -f "$MODELS_DIR/$DRAFT_FILE" ] && [ ! -f "$SHARED_DIR/$DRAFT_FILE.ok" ]; then
                echo "==> Migrating $DRAFT_FILE from per-app to shared"
                mv "$MODELS_DIR/$DRAFT_FILE" "$SHARED_DIR/$DRAFT_FILE"
                touch "$SHARED_DIR/$DRAFT_FILE.ok"
              fi
              if [ ! -f "$SHARED_DIR/$DRAFT_FILE.ok" ]; then
                echo "==> Downloading DFlash2 drafter $DRAFT_FILE"
                eval curl -fL -C - --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30 $HF_AUTH \
                  "https://huggingface.co/${DRAFT_MODEL}/resolve/main/${DRAFT_FILE}" \
                  -o "$SHARED_DIR/$DRAFT_FILE"
                touch "$SHARED_DIR/$DRAFT_FILE.ok"
              fi
              if [ ! -f /config/chat_template.jinja.ok ]; then
                echo "==> Downloading pinned chat template"
                eval curl -fL --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30 $HF_AUTH \
                  "$CHAT_TEMPLATE_URL" -o /config/chat_template.jinja
                touch /config/chat_template.jinja.ok
              fi
              exec /usr/local/bin/llama-server \
                --model "$SHARED_DIR/$TARGET_FILE" \
                --model-draft "$SHARED_DIR/$DRAFT_FILE" \
                --spec-type dflash \
                --alias "$MODEL_ALIAS" \
                --host 0.0.0.0 --port 8000 \
                --n-gpu-layers 99 \
                --n-gpu-layers-draft 99 \
                --spec-draft-n-max "${SPEC_DRAFT_N_MAX:-7}" \
                --ctx-size "${CTX_SIZE:-98304}" \
                --threads "${THREADS:-16}" \
                --threads-batch "${THREADS:-16}" \
                --cache-type-k turbo3 --cache-type-v turbo3 \
                --batch-size 512 --ubatch-size 512 \
                --parallel 1 \
                --flash-attn on --jinja \
                --chat-template-file /config/chat_template.jinja \
                --reasoning-format deepseek \
                --reasoning-preserve
          envFrom:
            - configMapRef:
                name: llamacpp-qwen38-dflash-env
          env:
            - name: HF_HOME
              value: "/models/huggingface"
            - name: HF_ENDPOINT
              value: "{{ .Values.olaresEnv.OLARES_USER_HUGGINGFACE_SERVICE }}"
            - name: HF_TOKEN
              value: "{{ .Values.olaresEnv.OLARES_USER_HUGGINGFACE_TOKEN }}"
            - name: MODELS_DIR
              value: "/models"
            - name: CUDA_DEVICE_MEMORY_LIMIT_0
              value: "24000m"
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 600
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 720
          resources:
            limits:
              cpu: "16"
              memory: 40Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: 4000m
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/shared-models"
              name: shared-models
            - mountPath: "/config"
              name: config
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.appData }}/models"
            type: DirectoryOrCreate
        - name: shared-models
          hostPath:
            path: "/olares/share/ai/model"
            type: DirectoryOrCreate
        - name: config
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacppqwen38dflashone
  name: llamacppqwen38dflashone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacpp-dflash"
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: llamacppqwen38dflashone
