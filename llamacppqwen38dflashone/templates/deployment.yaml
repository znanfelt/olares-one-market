---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamacpp-qwen38-dflash-env
  namespace: "{{ .Release.Namespace }}"
data:
  TARGET_MODEL: "unsloth/Qwen3.8-27B-GGUF"
  TARGET_FILE: "Qwen3.8-27B-UD-Q4_K_XL.gguf"
  DRAFT_MODEL: "incoai/Qwen3.8-27B-DFlash2-GGUF"
  DRAFT_FILE: "Qwen3.8-27B-DFlash2-Q4_K_M.gguf"
  MODEL_ALIAS: "qwen3.8-27b-dflash2"
  # 200K context on kvarn4 KV cache — sits comfortably under 24 GB alongside
  # the UD-Q4_K_XL target and the DFlash2 Q4_K_M drafter.
  CTX_SIZE: "204800"
  THREADS: "16"
  SPEC_DRAFT_N_MAX: "7"
  # BeeLlama KV cache: kvarn4 target, kvarn2 draft. kvarn is BeeLlama's
  # rotated low-bit KV format (successor to TurboQuant turbo3/4). Under
  # kvarn the intrinsic exact suffix stays at 128 tokens; --kv-tail-tokens
  # raises that to 1024 for the target cache.
  CACHE_TYPE: "kvarn4"
  DRAFT_CACHE_TYPE: "kvarn2"
  KV_TAIL_TOKENS: "1024"
  CHAT_TEMPLATE_URL: "https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates/resolve/855bffc49448e299789730ff92c9b8d834d6cc14/chat_template.jinja"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: llamacppqwen38dflashone
  name: llamacppqwen38dflashone
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: llamacppqwen38dflashone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacppqwen38dflashone
    spec:
      initContainers:
        - name: fix-shared-perms
          image: "docker.io/alpine:3.20"
          command: ["sh", "-c", "mkdir -p /shared-models/llms && chmod -R 777 /shared-models && echo perms-fixed"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: "/shared-models"
              name: shared-models
      containers:
        - name: llamacpp-qwen38-dflash-server
          # BeeLlama CUDA 13.3 server build. Requires the Olares R610 driver
          # bump (beclab/Olares#4100). Tag pins to release v0.4.6 published
          # 2026-09-08. Successor to spiritbuun/buun-llama-cpp: newer llama.cpp
          # base that parses the Qwen 3.8 tensor layout the old buun 0.2.0
          # image tripped over (866 vs 862 tensors), plus DFlash1+2 and the
          # kvarn KV cache family.
          image: "ghcr.io/anbeeld/beellama.cpp:server-cuda13-v0.4.6"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              MODELS_DIR=${MODELS_DIR:-/models}
              SHARED_DIR=${SHARED_DIR:-/shared-models/llms}
              HF_BASE=${HF_ENDPOINT:-https://huggingface.co}
              HF_BASE=${HF_BASE%/}
              mkdir -p "$MODELS_DIR" "$SHARED_DIR" /config

              # Safe curl args — no eval, quoted token
              curl_args=(-fL -C - --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30)
              if [ -n "${HF_TOKEN:-}" ]; then
                curl_args+=(-H "Authorization: Bearer ${HF_TOKEN}")
              fi

              # Download to .part, validate non-empty, atomic-rename, then write marker
              download() {
                local url="$1" destination="$2"
                local marker="${destination}.ok"
                local part="${destination}.part"
                if [ -s "$destination" ] && [ -f "$marker" ]; then
                  echo "==> Cached: ${destination}"
                  return 0
                fi
                rm -f "$marker"
                echo "==> Downloading ${destination}"
                curl "${curl_args[@]}" "$url" -o "$part"
                [ -s "$part" ] || { echo "empty download: $part"; exit 1; }
                mv -f "$part" "$destination"
                touch "$marker"
              }

              # Migrate per-app model files to shared cache if present (legacy layout)
              if [ -f "$MODELS_DIR/$TARGET_FILE" ] && [ ! -s "$SHARED_DIR/$TARGET_FILE" ]; then
                echo "==> Migrating $TARGET_FILE to shared cache"
                mv "$MODELS_DIR/$TARGET_FILE" "$SHARED_DIR/$TARGET_FILE"
                rm -f "$MODELS_DIR/$TARGET_FILE.ok"
              fi
              if [ -f "$MODELS_DIR/$DRAFT_FILE" ] && [ ! -s "$SHARED_DIR/$DRAFT_FILE" ]; then
                echo "==> Migrating $DRAFT_FILE to shared cache"
                mv "$MODELS_DIR/$DRAFT_FILE" "$SHARED_DIR/$DRAFT_FILE"
                rm -f "$MODELS_DIR/$DRAFT_FILE.ok"
              fi

              download "${HF_BASE}/${TARGET_MODEL}/resolve/main/${TARGET_FILE}" "$SHARED_DIR/$TARGET_FILE"
              download "${HF_BASE}/${DRAFT_MODEL}/resolve/main/${DRAFT_FILE}"   "$SHARED_DIR/$DRAFT_FILE"

              # Chat template — small file, no resume
              if [ ! -s /config/chat_template.jinja ] || [ ! -f /config/chat_template.jinja.ok ]; then
                rm -f /config/chat_template.jinja.ok
                tpl_args=(-fL --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30)
                if [ -n "${HF_TOKEN:-}" ]; then
                  tpl_args+=(-H "Authorization: Bearer ${HF_TOKEN}")
                fi
                curl "${tpl_args[@]}" "${CHAT_TEMPLATE_URL}" -o /config/chat_template.jinja.part
                [ -s /config/chat_template.jinja.part ] || { echo "empty template"; exit 1; }
                mv -f /config/chat_template.jinja.part /config/chat_template.jinja
                touch /config/chat_template.jinja.ok
              fi

              # BeeLlama server. Key flag differences vs the old buun 0.2.0 stack:
              #   --spec-type draft-dflash (was: dflash)
              #   --spec-draft-model     (was: --model-draft)
              #   --spec-draft-ngl all   (was: --n-gpu-layers-draft 99)
              #   --spec-draft-type-k/v kvarn2  (owned draft KVarN cache)
              #   --spec-dm-controller profit   (DFlash1 profit controller;
              #                                  DFlash2 uses its fixed block
              #                                  limit regardless)
              #   --kv-tail-tokens 1024         (raise KVarN exact suffix)
              exec /app/llama-server \
                --model "$SHARED_DIR/$TARGET_FILE" \
                --spec-type draft-dflash \
                --spec-draft-model "$SHARED_DIR/$DRAFT_FILE" \
                --spec-draft-ngl all \
                --spec-draft-n-max "${SPEC_DRAFT_N_MAX:-7}" \
                --spec-dm-controller profit \
                --alias "$MODEL_ALIAS" \
                --host 0.0.0.0 --port 8000 \
                --n-gpu-layers 99 \
                --ctx-size "${CTX_SIZE:-204800}" \
                --threads "${THREADS:-16}" \
                --threads-batch "${THREADS:-16}" \
                --cache-type-k "${CACHE_TYPE:-kvarn4}" --cache-type-v "${CACHE_TYPE:-kvarn4}" \
                --spec-draft-type-k "${DRAFT_CACHE_TYPE:-kvarn2}" --spec-draft-type-v "${DRAFT_CACHE_TYPE:-kvarn2}" \
                --kv-tail-tokens "${KV_TAIL_TOKENS:-1024}" \
                --batch-size 512 --ubatch-size 512 \
                --parallel 1 \
                --flash-attn on --jinja \
                --chat-template-file /config/chat_template.jinja
          envFrom:
            - configMapRef:
                name: llamacpp-qwen38-dflash-env
          env:
            - name: HF_HOME
              value: "/models/huggingface"
            - name: HF_ENDPOINT
              value: "{{ .Values.olaresEnv.OLARES_USER_HUGGINGFACE_SERVICE }}"
            - name: HF_TOKEN
              value: "{{ .Values.olaresEnv.OLARES_USER_HUGGINGFACE_TOKEN }}"
            - name: MODELS_DIR
              value: "/models"
            # HAMi-core "0m" parsing bug workaround. 24400m leaves ~80 MB
            # margin under the 5090M's 24463 MB reported ceiling.
            - name: CUDA_DEVICE_MEMORY_LIMIT_0
              value: "24400m"
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 600
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 720
          resources:
            limits:
              cpu: "16"
              memory: 40Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: 4000m
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/shared-models"
              name: shared-models
            - mountPath: "/config"
              name: config
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.appData }}/models"
            type: DirectoryOrCreate
        - name: shared-models
          hostPath:
            path: "/olares/share/ai/model"
            type: DirectoryOrCreate
        - name: config
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacppqwen38dflashone
  name: llamacppqwen38dflashone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacpp-dflash"
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: llamacppqwen38dflashone
