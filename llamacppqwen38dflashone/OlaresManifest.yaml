spec:
  versionName: 2.0.0
  upgradeDescription: |
    v2.0.0: Backend replaced. The chart now runs on ghcr.io/anbeeld/beellama.cpp:server-cuda13-v0.4.6 (BeeLlama release v0.4.6, published 2026-09-08) instead of docker.io/aamsellem/buun-llama-cpp-dflash:0.2.0.

    Why: the first on-device install of v1.0.1 crashed loading the target GGUF with 'done_getting_tensors: wrong number of tensors; expected 866, got 862'. The unsloth Qwen3.8-27B UD-Q4_K_XL file bakes the MTP head into the base GGUF (n_layer 65, nextn_predict_layers 1). The buun 0.2.0 binary is on llama.cpp b9017 — pre-Qwen 3.8 — and does not know the 4 extra MTP-head tensors, so the loader rejects the file. BeeLlama's newer llama.cpp base parses the Qwen 3.8 tensor layout and ignores the MTP head when DFlash is the speculator.

    Requires the Olares R610 driver (610.57.04) so the CUDA 13.3 base image can start; the driver bump is tracked at beclab/Olares#4100 and is already deployed on the device this chart targets. The CUDA 12 BeeLlama build was considered but skipped because Blackwell FP4/kvarn kernels ship in the CUDA 13 build.

    Flag surface migrated from the buun DFlash spelling to the BeeLlama DFlash spelling:
      --spec-type dflash        -> --spec-type draft-dflash
      --model-draft <path>      -> --spec-draft-model <path>
      --n-gpu-layers-draft 99   -> --spec-draft-ngl all
      --cache-type-k/v turbo4   -> --cache-type-k/v kvarn4
      (new)                     -> --spec-draft-type-k/v kvarn2
      (new)                     -> --spec-dm-controller profit
      (new)                     -> --kv-tail-tokens 1024

    Target, drafter, chat template, context, and download hardening are unchanged from v1.0.1. Not upgrade-compatible with v1.0.x — reinstall recommended (the shared /olares/share/ai/model cache means the target and drafter GGUFs are not re-downloaded).

    v1.0.1: removed --reasoning-preserve and --reasoning-format from the llama-server command line after v1.0.0 crashed on the buun 0.2.0 image with 'error: invalid argument: --reasoning-preserve'. Reasoning parsing is handled client-side; the pinned froggeric chat template is still applied via --jinja + --chat-template-file. See PR #21 comment 5613857673.

    v1.0.0: Qwen3.8-27B DFlash2 chart tuned to the community-validated Olares One configuration reported in aamsellem/olares-one-market#19 (comment 5560770922): UD-Q4_K_XL target + DFlash2-Q4_K_M drafter (n-max 7), TurboQuant turbo4 K/V, 200K context. Used docker.io/aamsellem/buun-llama-cpp-dflash:0.2.0, the same buun image already published for the merged Qwen3.6 DFlash chart.
  fullDescription: |
    Qwen3.8-27B dense with the DFlash2 block-diffusion speculative drafter (n-max 7) served through Anbeeld's BeeLlama fork of llama.cpp on a CUDA 13.3 base. Positioned as the fast experimental sibling to the upstream-pure llamacppqwen38mtpone chart.

    Requires the Olares One R610 driver (610.57.04). The CUDA 13.3 container will refuse to start on the stock R595 driver; the driver bump is tracked at beclab/Olares#4100.

    Stack:
      - Image: ghcr.io/anbeeld/beellama.cpp:server-cuda13-v0.4.6 (release v0.4.6, published 2026-09-08; successor to spiritbuun/buun-llama-cpp with newer llama.cpp base + kvarn KV cache family + DFlash1/2)
      - Target: unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf (~17.6 GB, shared with the Qwen3.8 MTP chart)
      - Drafter: incoai/Qwen3.8-27B-DFlash2-GGUF/Qwen3.8-27B-DFlash2-Q4_K_M.gguf (~1.1 GB)
      - Drafter fallback: analogalok/Qwen3.8-27B-DFlash2-Q2_K-GGUF/Qwen3.8-27B-DFlash2-Q2_K.gguf (~705 MB)
      - Chat template: froggeric/Qwen-Fixed-Chat-Templates @ 855bffc49448e299789730ff92c9b8d834d6cc14 via --jinja + --chat-template-file
      - Context: 200K (204800 tokens)
      - KV cache: kvarn4 target K + V, kvarn2 owned draft K + V, 1024-token exact tail
      - Speculative decoding: --spec-type draft-dflash, n-max 7, --spec-draft-ngl all, --spec-dm-controller profit
      - Reasoning parsing: handled client-side (v1.0.0's --reasoning-preserve was rejected by the earlier buun binary; BeeLlama's flag surface has not been re-tested for those specific flags on this hardware, so they remain out)

    First launch downloads the shared target and a separate DFlash2 drafter from Hugging Face. Configure the Olares Hugging Face token/service when required. The server exposes an OpenAI-compatible API on port 8000.

    Fallback ladder (edit values or ConfigMap):
      1. Q4_K_M drafter at 200K, kvarn4/kvarn2 (default)
      2. Q4_K_M drafter at 128K, kvarn4/kvarn2
      3. Q2_K drafter at 200K, kvarn4/kvarn2
      4. Q4_K_M drafter at 96K, kvarn5/kvarn3
