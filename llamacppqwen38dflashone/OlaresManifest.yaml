spec:
  versionName: 1.0.0
  upgradeDescription: |
    v1.0.0: Qwen3.8-27B DFlash2 chart tuned to the community-validated Olares One configuration reported in aamsellem/olares-one-market#19 (comment 5560770922): UD-Q4_K_XL target + DFlash2-Q4_K_M drafter (n-max 7), TurboQuant turbo4 K/V, 200K context.

    Uses docker.io/aamsellem/buun-llama-cpp-dflash:0.2.0 — the same buun image already published under this repository for the merged Qwen3.6 DFlash chart. Deployment enabled by default. Sibling to llamacppqwen38mtpone: the MTP chart remains the upstream-pure baseline; this chart is the fast experimental TurboQuant/DFlash2 profile.

    Target: unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf (shared path/filename with the Qwen3.8 MTP chart to avoid a duplicate download). Drafter: incoai/Qwen3.8-27B-DFlash2-GGUF/Qwen3.8-27B-DFlash2-Q4_K_M.gguf. Documented drafter fallback: analogalok/Qwen3.8-27B-DFlash2-Q2_K-GGUF/Qwen3.8-27B-DFlash2-Q2_K.gguf.

    First on-device run of the previous chart revision failed with 'invalid argument: --reasoning-preserve' on this binary. This revision removes both --reasoning-preserve and --reasoning-format to match the flag surface of the merged Qwen3.6 DFlash sibling chart; reasoning parsing is handled client-side (the froggeric template is still applied via --jinja + --chat-template-file).

    Download hardening: no eval, safe curl arrays, quoted HF token, HF_ENDPOINT proxy respected, .part downloads with atomic rename and marker validation.
  fullDescription: |
    Qwen3.8-27B dense with the DFlash2 block-diffusion speculative drafter (n-max 7) served through the buun-llama-cpp fork with TurboQuant turbo4 K/V caches. Positioned as the fast experimental sibling to the upstream-pure llamacppqwen38mtpone chart.

    Community-validated configuration (Olares One, RTX 5090 Mobile, 24 GB, reported at 80–110 t/s):

    Stack:
      - Image: docker.io/aamsellem/buun-llama-cpp-dflash:0.2.0 (already published; used by the merged llamacppqwen36dflashone chart)
      - Target: unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf (~17.6 GB, shared with the Qwen3.8 MTP chart)
      - Drafter: incoai/Qwen3.8-27B-DFlash2-GGUF/Qwen3.8-27B-DFlash2-Q4_K_M.gguf (~1.1 GB)
      - Drafter fallback: analogalok/Qwen3.8-27B-DFlash2-Q2_K-GGUF/Qwen3.8-27B-DFlash2-Q2_K.gguf (~705 MB)
      - Chat template: froggeric/Qwen-Fixed-Chat-Templates @ 855bffc49448e299789730ff92c9b8d834d6cc14 via --jinja + --chat-template-file
      - Context: 200K (204800 tokens)
      - KV cache: TurboQuant turbo4 K + turbo4 V
      - Speculative decoding: DFlash n-max 7, full drafter GPU offload
      - Reasoning parsing: handled client-side (the buun 0.2.0 binary rejects --reasoning-preserve; add server-side reasoning flags in a follow-up once the image supports them)

    First launch downloads the shared target and a separate DFlash2 drafter from Hugging Face. Configure the Olares Hugging Face token/service when required. The server exposes an OpenAI-compatible API on port 8000.

    Fallback ladder (edit values or ConfigMap):
      1. Q4_K_M drafter at 200K, turbo4 (default)
      2. Q4_K_M drafter at 128K, turbo4
      3. Q2_K drafter at 200K, turbo4
      4. Q4_K_M drafter at 96K, turbo3
