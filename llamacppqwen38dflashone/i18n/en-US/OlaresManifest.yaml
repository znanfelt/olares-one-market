metadata:
  title: Qwen38 27B DFlash
  description: "Qwen3.8 27B with DFlash2 drafter and kvarn4 KV on BeeLlama CUDA 13.3 — 200K context"

spec:
  fullDescription: |
    Qwen3.8 27B dense with DFlash2 block-diffusion speculative drafter (n-max 7) via Anbeeld's BeeLlama fork of llama.cpp on a CUDA 13.3 base.
    Fast experimental sibling to the upstream-pure llamacppqwen38mtpone chart.
    Target: unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf.
    Drafter: incoai/Qwen3.8-27B-DFlash2-GGUF/Qwen3.8-27B-DFlash2-Q4_K_M.gguf, with analogalok Q2_K fallback.
    Chat template: froggeric/Qwen-Fixed-Chat-Templates @ 855bffc49448e299789730ff92c9b8d834d6cc14.
    Profile: 200K context, kvarn4 target KV + kvarn2 owned draft KV, --kv-tail-tokens 1024, DFlash n-max 7, full target and draft GPU offload.
    Image: ghcr.io/anbeeld/beellama.cpp:server-cuda13-v0.4.6.
    Requires the Olares One R610 driver (610.57.04); the CUDA 13.3 base image will not start on the stock R595 driver. Driver bump tracked at beclab/Olares#4100.
