metadata:
  title: Qwen38 27B DFlash
  description: "Qwen3.8 27B with DFlash2 drafter and TurboQuant turbo4 KV on buun llama.cpp — 200K context"

spec:
  fullDescription: |
    Qwen3.8 27B dense with DFlash2 block-diffusion speculative drafter (n-max 7) via the buun-llama-cpp TurboQuant backend.
    Fast experimental sibling to the upstream-pure llamacppqwen38mtpone chart.
    Target: unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf.
    Drafter: incoai/Qwen3.8-27B-DFlash2-GGUF/Qwen3.8-27B-DFlash2-Q4_K_M.gguf, with analogalok Q2_K fallback.
    Chat template: froggeric/Qwen-Fixed-Chat-Templates @ 855bffc49448e299789730ff92c9b8d834d6cc14.
    Profile: 200K context, TurboQuant turbo4, DFlash n-max 7, full target and draft GPU offload.
    Image: docker.io/aamsellem/buun-llama-cpp-dflash:0.2.0 (same image published for the merged Qwen3.6 DFlash chart).
    Community-reported throughput on the Olares One (RTX 5090M, 24 GB): 80–110 t/s.
